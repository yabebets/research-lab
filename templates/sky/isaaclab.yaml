# SkyPilot のタスク定義：isaaclab（rl sim setup isaaclab でプロジェクトの configs/sky/ に写し、rl gpu up <project> configs/sky/isaaclab.yaml --hours H --usd-per-hour X で立てる）
# G2（計画と予算の承認）のあとでだけ使う。使い終わったら rl gpu down（放置は自動で消える）
name: rl-isaaclab

resources:
  infra: runpod            # lambda にするなら lambda
  accelerators: {L40S: 1, RTX4090: 1}
  disk_size: 200

workdir: .

envs:
  MAX_HOURS: 4             # rl gpu up が --hours で上書きする

setup: |
  pip install -q uv
  # Isaac Lab の公式の手順（pip 版）。版は lock に書いたものに合わせる
  pip install -q "isaaclab[isaacsim,all]" --extra-index-url https://pypi.nvidia.com

run: |
  timeout "${MAX_HOURS}h" python -m src.run_sim   # 実験のスクリプトに置き換える
