# シミュレーターと道具の一覧（rl sim が読む）。プロジェクトに入れた版は、各プロジェクトの sims.lock.yaml に残る
# kind:
#   py      … プロジェクトの .venv に uv pip で入れる（spec は範囲でよい。入った正確な版を lock に書く）
#   git     … 版（commit）を固定して ~/research-lab/.cache/sims/<名前>/<commit>/ に取り込む（共有のキャッシュ）
#   cli     … 手元のコマンドとして入れる（uv tool）
#   remote  … 手元では動かない。借りた GPU で立てる（templates/sky/<名前>.yaml を rl gpu up で使う。G2 の承認が要る）
# platform: any（Mac でも動く） / cuda（NVIDIA GPU が要る） / rtx（RTX 系の GPU が要る。A100・H100 は描画できない）
tools:
  mujoco:
    kind: py
    spec: "mujoco>=3.3"
    import: mujoco
    platform: any
    license: Apache-2.0
    smoke: mujoco
    desc: 接触のある操作の物理シミュレーター。Mac で動く。ビューア付き
  menagerie:
    kind: git
    repo: https://github.com/google-deepmind/mujoco_menagerie
    ref: 98a70c569c4c1b6da467a20012f766ee1f8dc521
    platform: any
    license: "モデルごとに違う（各フォルダの LICENSE を見る。UR5e は BSD-3、Robotiq 2F-85 は BSD-2）"
    desc: MuJoCo 用のロボットのモデル集（UR5e・Robotiq 2F-85・Franka・ALOHA・Unitree G1 など）
  openarm-mujoco:
    kind: git
    repo: https://github.com/enactic/openarm_mujoco
    ref: 1daab06716b779376dbe7f01fb0548f8b539bb35
    platform: any
    license: "Apache-2.0"
    desc: OpenArm の公式の MuJoCo のモデル（v1 はハード 1.0 系、v2・Cell もあり。双腕は v1/openarm_bimanual.xml）。組む側のロボットに使う
  geom:
    kind: py
    spec: ["trimesh>=4", "python-fcl>=0.7", "manifold3d>=3"]
    import: [trimesh, fcl, manifold3d]
    platform: any
    license: "MIT / BSD / Apache-2.0"
    smoke: geom
    desc: メッシュの処理と正確な干渉の判定（判定器 L1 が使う）
  cad:
    kind: py
    spec: "cadquery-ocp>=7.7"
    import: OCP
    platform: any
    license: Apache-2.0（OCCT は LGPL-2.1）
    smoke: cad
    desc: STEP の読み込み・アセンブリの木・面への分割（Open CASCADE）
  asap:
    kind: git
    repo: https://github.com/yunshengtian/ASAP
    ref: 3727e716b57e0b508c4e9ecd9fefa6953e8f72da
    platform: any
    license: MIT
    build: "macOS arm64 では Eigen 3.3.9 への差し替えと torch_scatter・torch_sparse のソースからのビルドが要る（notes/pilot/t12-asap-so101-2026-11-10.md §1 の手順）"
    desc: 物理を使う組立順序計画（分解からの逆算）
  fabrica:
    kind: git
    repo: https://github.com/yunshengtian/Fabrica
    ref: 215a30fe51e59299588a5b5e417a9cb934fb393e
    platform: any
    license: MIT（同梱のグリッパのメッシュは出所未確認）
    build: "計画部は CPU で動く。取り込んだ木には手を入れず、redmax は写しの上でビルドする（pybind11・libigl は asap から、Eigen は eigen の 3.3.9、scipy 1.10.1）。robot-assembly-bench では rl sim setup fabrica asap eigen のあと src/rabench/l2/tools/setup_env.sh が venv（.cache/venvs/fabrica-l2、Python 3.10）を作る（notes/dev-checks/t26-openarm-2026-11-10.md の T27）。挿入の方策（L3）は Isaac Gym（remote）"
    desc: 双腕の多部品組立の計画（把持・保持・治具）と挿入の学習
  eigen:
    kind: git
    repo: https://gitlab.com/libeigen/eigen.git
    ref: 0fd6b4f71dd85b2009ee4d1aeb296e2c11fc9d68
    platform: any
    license: "MPL-2.0"
    desc: "C++ の線形代数のヘッダ（タグ 3.3.9）。ASAP・Fabrica の redmax が同梱する 3.3.4 は Apple clang 21 で通らないので、ビルドの写しでこれに差し替える"
  skypilot:
    kind: cli
    install: "uv tool install 'skypilot[runpod,lambda]'"
    check: "sky --version"
    platform: any
    license: Apache-2.0
    desc: クラウドの GPU を設定ファイル 1 つで立てて消す道具（rl gpu up が使う。アカウントと支払いの設定は人）
  isaaclab:
    kind: remote
    platform: rtx
    gpu: "RTX 4090 か L40S"
    template: templates/sky/isaaclab.yaml
    license: "BSD-3（Isaac Lab）。Isaac Sim は NVIDIA の利用条件"
    desc: GPU で大量並列の強化学習・ヒューマノイド・写実的な描画
  isaacgym:
    kind: remote
    platform: rtx
    gpu: "RTX 4090 か L40S"
    template: templates/sky/isaacgym.yaml
    license: "NVIDIA の Isaac Gym Preview の利用条件（ダウンロードに NVIDIA の開発者登録が要る → 人の作業）"
    desc: 旧世代の GPU 物理シミュレーター。Fabrica の挿入の方策（L3）が使う
  maniskill:
    kind: remote
    platform: cuda
    gpu: "L4 か A10 以上"
    template: templates/sky/maniskill.yaml
    license: Apache-2.0
    desc: GPU 並列の操作課題のシミュレーターとベンチマーク
  genesis:
    kind: remote
    platform: cuda
    gpu: "L4 か A10 以上"
    template: templates/sky/genesis.yaml
    license: Apache-2.0
    desc: 高速な汎用物理シミュレーター
  drake:
    kind: py
    spec: "drake>=1.58"
    import: pydrake
    python: "3.12"           # macOS arm64 の 1.58 の wheel は cp312・macOS 26 以降だけ。プロジェクトの .venv が 3.11 なら別の venv（.cache/venvs/drake）に入れる
    platform: any
    license: "BSD-3-Clause（Drake。PyPI の分類は BSD と Other/Proprietary＝同梱の第三者のライブラリはそれぞれの条件）"
    smoke: drake
    desc: 多体力学・接触・最適化（MultibodyPlant・SceneGraph）。手元で動く
  mjx:
    kind: remote
    platform: cuda
    gpu: "L4 か A10 以上（JAX の CUDA 12）"
    spec: "mujoco-mjx==4.0.0"
    template: templates/sky/mjx.yaml
    license: "Apache-2.0（mujoco-mjx。JAX も Apache-2.0）"
    desc: MuJoCo を JAX で GPU 並列に（強化学習・大量の rollout）。CPU の JAX なら Mac でも動くが遅い（デバッグ用）
  mujoco-warp:
    kind: remote
    platform: cuda
    gpu: "L4 か A10 以上（NVIDIA Warp）"
    spec: "mujoco-warp==4.0.0"
    repo: https://github.com/google-deepmind/mujoco_warp
    ref: 4d1c64bc077d725247e9bf5e2ac3f357749ff804
    template: templates/sky/mujoco-warp.yaml
    license: "Apache-2.0（mujoco_warp。warp-lang も Apache-2.0）"
    desc: MuJoCo を NVIDIA Warp で GPU 並列に（MJX の後継の流れ。接触の多い場面に強い）
  lerobot:
    kind: py
    spec: "lerobot>=0.7,<0.8"
    import: lerobot
    python: "3.12"           # 0.7 は Python 3.12 以上。macOS arm64 で入ることを確認（0.7.0、torch 2.15.0、MPS が使える。2026-11-10）
    platform: any
    license: "Apache-2.0（コード）。重み：SmolVLA（lerobot/smolvla_base）Apache-2.0、π0・π0.5（lerobot/pi0_base・pi05_base）は Gemma の利用条件。ACT・Diffusion Policy は自分で学習する（配布の重みは使わない）"
    smoke: lerobot
    desc: Hugging Face の LeRobot（ACT・Diffusion Policy・SmolVLA・π0、データセットの形式、SO-101 のドライバ）。学習は手元の MPS で小さく、本番は借りた GPU
  openpi:
    kind: remote
    platform: cuda
    gpu: "推論・LoRA は RTX 4090（22.5 GB 以上）、全体の微調整は A100-80GB / H100"
    repo: https://github.com/Physical-Intelligence/openpi
    ref: 215abfb217dbac7d5f1273282331b9b1866c0479
    template: templates/sky/openpi.yaml
    license: "Apache-2.0（コード）。重み（gs://openpi-assets の π0・π0-FAST・π0.5 と各専門の checkpoint）は PaliGemma 由来で Gemma Terms of Use（リポジトリの LICENSE_GEMMA.txt）。取得にログインは要らない"
    desc: Physical Intelligence の π0・π0.5（VLA）。Ubuntu 22.04 だけ対応
  openvla-oft:
    kind: remote
    platform: cuda
    gpu: "推論は 24 GB 級、微調整は A100-80GB / H100 を 1〜8 枚（目安）"
    repo: https://github.com/moojink/openvla-oft
    ref: e4287e94541f459edc4feabc4e181f537cd569a8
    template: templates/sky/openvla-oft.yaml
    license: "MIT（コード）。重み（openvla/openvla-7b・moojink/openvla-7b-oft-*）は HF のタグが MIT。土台の言語モデル（Llama 2 7B）の利用条件は別に確かめる（未確認）"
    desc: OpenVLA の微調整の改良版（並列の復号・行動の塊・連続値の行動）。LIBERO・ALOHA の例つき
  cosmos-policy:
    kind: remote
    platform: cuda
    gpu: "推論は 1 枚 10 GB 以上、学習は 80 GB ×8 以上（論文は H100 ×8〜64 で 48 時間）"
    repo: https://github.com/NVlabs/cosmos-policy
    ref: 18a2accadf4e7a3531e56754102af5a24d2316da
    template: templates/sky/cosmos-policy.yaml
    license: "Apache-2.0（コード）。重み（nvidia/Cosmos-Policy-*-Predict2-2B）は NVIDIA One-Way Noncommercial License（NSCLv1、非商用）。土台の nvidia/Cosmos-Predict2-2B-Video2World は HF で利用条件への同意が要る（gated、NVIDIA Open Model License）→ 人の作業"
    desc: NVIDIA の Cosmos Policy（映像の世界モデル Cosmos-Predict2 を方策に微調整）。LIBERO・RoboCasa・ALOHA の例つき
