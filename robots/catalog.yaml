# ロボットの公開データの一覧（rl robot が読む）。ここに書くのは取得元・版・ライセンス・中身の説明だけ。データ本体は書かない
# データは ~/research-lab/.cache/robots/<robot>/<version>/raw/ に置き（git の管理外）、プロジェクトからはリンクで使う。
# このリポジトリは公開なので、取得したファイルを robots/ や projects/ の git に入れない
#
# 項目:
#   role       test（評価に使う）/ dev（判定器・前処理・プロンプトの調整用。配らない）/ other
#   version    キャッシュのフォルダ名。commit の先頭 8 桁か、リリースのタグ
#   link_as    プロジェクトの中のリンクの場所（既定 data/raw/<robot>）
#   sources    取得の手順。method:
#                git      … commit を固定した sparse checkout。include は gitignore の書式（no-cone）。
#                           include_from_manifest: true なら robots/sums/<robot>/<version>.txt にある分だけ取る。
#                           map（リポジトリのパス → 置く場所）、flatten（フォルダを無くす）、exclude（外す名前）。Git LFS は自動で取る
#                url      … 1 ファイル（リリースの添付など）。sha256 があれば照合する
#                unzip    … 取った zip を展開する
#                snapshot … Web ページの保存など、同じものを自動で取り直せないもの（手順は note）
#   local_files 取得のときに手元で作ったファイル（取り直せない。控えには入っている）
#   verify     主なファイルの sha256（公開値・LFS の oid など）
#   licenses   hardware / docs / software / weights を分けて書く。third_party は再配布してはいけないもの
#   gated      ログイン・登録・メールが要るもの（rl robot fetch は取らない。サインアップを自動でしない）
#   pending    公開待ち（データがまだ公開されていない）。理由と予定を書く。rl robot fetch・link は断り、list は「公開待ち」と出す。
#              公開されたら sources を書いて pending を消す
#   derived    raw から作ったもの。location: cache は <cache>/<robot>/<version>/derived/<name>@<version>/ に置く
#              （移す前のパス raw/_derived/<from> にはリンクを残す）。location: project はプロジェクトの中に置いたまま
#              scripts は research-lab からの相対パス
robots:
  roboto_origin:
    role: test
    desc: RoboParty の人型（V2.0、DM モータ 23）。全体の組立は SolidWorks のみ
    version: "e60f6745"
    sources:
      - method: git
        repo: https://github.com/Roboparty/rpo_hardware
        commit: e60f6745b27b2331dff28c01284c1fe6cee74d42   # 2026-11-04。LICENSES.md が「Covered Source の置き場所」と指定する正本
        dest: rpo_hardware
        include_from_manifest: true   # 手順書・配線・部品表・STEP/STP・URDF・PCB の文書（SolidWorks と STL は別）
        include: ["/*.md", "/LICENSE", "/atom_id.png", "/V2.0/", "!/V2.0/**/*.SLD*", "!/V2.0/**/*.sld*", "/V1.0/atom01_mechanic/00_Docs/", "/V1.0/atom01_pcb/"]
      - method: git
        repo: https://github.com/Roboparty/rpo_hardware
        commit: e60f6745b27b2331dff28c01284c1fe6cee74d42
        dest: solidworks
        include: ["/V2.0/roboto_origin_mechanic/01_SW_Project/roboto_origin_2.0/*.SLD*", "/V2.0/roboto_origin_mechanic/01_SW_Project/roboto_origin_2.0/*.sld*"]
        flatten: true
        exclude: ["三合一(1).SLDASM"]   # 電源基板（ロボットの組立ではない）
    verify:
      solidworks/ATOM01总装配体重装.SLDASM: a5a63626edd8ca3b8ff1bfb68f4a9c0c16152d82a7d6532a1fb5841f6757b906
    licenses:
      hardware: CERN-OHL-W-2.0（LICENSE・LICENSES.md。CAD・中立形式・BOM・製造データ・URDF・メッシュ）
      docs: CC-BY-SA-4.0（README・手引き・説明画像。ただし設計・製造の文書はハードの扱い）
      software: 手順書の付録 3 は「核心源代码基于 GPL V3」（ソフトの話。ハードのライセンスとは別）
      third_party: THIRD_PARTY_NOTICES.md — DM モータ・電池・ベアリング・GB/T のねじ・OPI-5PLUS・LB22SA2M1-M10 などの他社モデルは対象外。ライセンス不明のものは参照のみ（複製・改変・再配布しない）
      trademarks: TRADEMARKS.md — 推薦・公認に見える使い方をしない
    contents:
      step: 部品単位のみ（CNC 27 種・治具・頭・PCB 載板。全体の STEP は無い。三合一.step は電源基板）
      solidworks: SLDASM 5（総組立 ATOM01总装配体重装.SLDASM 61 MB）・SLDPRT 69
      urdf: V2.0/roboto_origin_mechanic/03_URDF（リンク単位の STL 24）
      bom: 散件清单 V1.1.3.xlsx 89 行（ねじはキットの袋の数）。V1.0 の BOM_Mechanical.xlsx はねじの使用数あり
      manual: 安装手册_0428.pdf（中国語・44 頁・STEP 1〜67＋ピン標定 6、文字は抽出可）、走线说明.pdf（配線 10 頁）
    notes:
      - 手順書の「视频安装教程」の QR のリンクは未確認
      - 集約リポジトリ Roboparty/roboto_origin（d94afba）の modules/rpo_hardware/ は同じ中身の写し
      - 詳細は projects/robot-assembly-bench/notes/data-manifest-2026-11-09.md §2.1、cad-check/roboto-free-assembly-2026-11-10.md
    derived:
      - name: sw_asm
        version: "2026-11-10"
        from: sw_asm
        desc: SLDASM の配置の XML と各 SLDPRT の表示用メッシュから、組立姿勢の部品ごとの STL（1,039 配置・854 メッシュ）と parts_manifest.json（部品座標 → URDF base_link の 4×4）
        inputs: [raw/solidworks/, derived/urdf_zero@2026-11-10/, derived/part_stl@2026-11-10/]
        tools: ["XRTC5/sldprt-export@31d3b5a（MIT、標準ライブラリだけの SolidWorks 読み取り器。中身を読んで確認済み）"]
        scripts:
          - projects/robot-assembly-bench/notes/data-scripts/roboto/sldasm_dump.py
          - projects/robot-assembly-bench/notes/data-scripts/roboto/place_missing.py
          - projects/robot-assembly-bench/notes/data-scripts/roboto/build_manifest.py
          - projects/robot-assembly-bench/notes/data-scripts/roboto/link_components.py
      - name: urdf_zero
        version: "2026-11-10"
        from: urdf_zero
        desc: URDF のリンクのメッシュを関節 0 の姿勢に並べたもの（24 リンク。リンク単位で部品単位ではない）
        inputs: [raw/rpo_hardware/V2.0/roboto_origin_mechanic/03_URDF/]
        scripts: [projects/robot-assembly-bench/notes/data-scripts/roboto/urdf_assemble.py]
      - name: part_stl
        version: "2026-11-10"
        from: part_stl
        desc: 部品単位の STEP を三角形に分けた STL
        inputs: [raw/rpo_hardware/V2.0/roboto_origin_mechanic/02_Manufacturing/]
        scripts: [projects/robot-assembly-bench/notes/data-scripts/roboto/step_tess.py]
      - name: register
        version: "2026-11-10"
        from: [reg_A.json, sw_vs_urdf.json]
        desc: 部品の STL と URDF の 0 姿勢の位置合わせ（reg_A）と、SLDASM の配置との照合（sw_vs_urdf）
        scripts:
          - projects/robot-assembly-bench/notes/data-scripts/roboto/register_parts.py
          - projects/robot-assembly-bench/notes/data-scripts/roboto/compare_sw_urdf.py
      - name: text
        version: "2026-11-10"
        from: [rpo_v1_guide.txt, rpo_v2_manual.txt, rpo_v2_wire.txt]
        desc: 手順書・配線書の PDF の文字（pdftotext）
        scripts: []

