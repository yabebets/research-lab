      bom: 表計算は登録が要る。代わりに公開の FABRICATION_MANIFEST.csv（部品 ID と STEP の対応。未取得）
      manual: Web・英語、76 ステップ（動画での確認 6）、小指示 521、3D の指示ビュー 416
    notes:
      - FABRICATION_MANIFEST・mechanical/ASV1/Docs の PDF 26 は T14 で読んだが、キャッシュには入っていない（必要なら sources に足す）
    derived:
      - name: text
        version: "2026-11-10"
        from: [asimov_steps.json, asimov_text_tree.json, asimov_text_tree.txt]
        desc: 手順書の HTML から取り出した工程（asimov_steps）と、STEP の文字列から取った組立の木
